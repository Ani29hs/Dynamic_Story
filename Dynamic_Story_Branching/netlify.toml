[build]
  publish = "frontend"

# Cache-control headers to prevent stale JS/CSS
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirect root to Landing page
[[redirects]]
  from = "/"
  to = "/Landing.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/Landing.html"
  status = 200