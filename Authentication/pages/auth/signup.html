<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Slush Story Engine</title>
    <link rel="stylesheet" href="../../css/signup.css">
    <!-- Lottie Web Player Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>

<body>
    <div class="signup-wrapper">
        <div class="signup-card">

            <!-- Left Side: Lottie Animation Panel -->
            <div class="lottie-panel">
                <div id="lottieContainer"></div>
                <div class="lottie-caption">
                    <h3>JOIN THE ADVENTURE!</h3>
                    <p>Create your account and start your story journey.</p>
                </div>
            </div>

            <!-- Right Side: Register Form -->
            <div class="form-panel">
                <h2 class="signup-title">📝 REGISTER</h2>
                <form onsubmit="handleRegister(event);" style="display: flex; flex-direction: column; gap: 14px;">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Create Password</label>
                        <div class="password-container">
                            <input type="password" placeholder="Min 8 chars (e.g. Pass@123)" id="password" required>
                            <button type="button" class="eye-toggle" onclick="togglePassword('password', 'eyeSymbol1')" aria-label="Toggle password visibility">
                                <span id="eyeSymbol1">👁️</span>
                            </button>
                        </div>
                        <p style="font-size: 11.5px; font-weight: 700; color: #64748b; margin-top: 6px; margin-bottom: 0;">🔒 Min 8 chars with letters, numbers &amp; special character</p>
                    </div>

                    <div class="form-group">
                        <label for="cpassword">Confirm Password</label>
                        <div class="password-container">
                            <input type="password" placeholder="Confirm password" id="cpassword" required>
                            <button type="button" class="eye-toggle" onclick="togglePassword('cpassword', 'eyeSymbol2')" aria-label="Toggle confirm password visibility">
                                <span id="eyeSymbol2">👁️</span>
                            </button>
                        </div>
                    </div>

                    <input type="submit" value="REGISTER →" style="margin-top: 6px;">

                    <a href="login.html" class="login-redirect-btn">
                        Already registered? Login here
                    </a>
                </form>
            </div>

        </div>
    </div>

    <script src="../../js/signup.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let container = document.getElementById("lottieContainer");
            if (container && typeof lottie !== "undefined") {
                lottie.loadAnimation({
                    container: container,
                    renderer: "svg",
                    loop: true,
                    autoplay: true,
                    path: "../../css/Login.json"
                });
            }
        });
    </script>
</body>

</html>
