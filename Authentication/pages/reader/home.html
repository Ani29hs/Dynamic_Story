<script>
    let user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
        alert("Access Denied!")
        window.location.href = "../auth/login.html";
    
    }

    else if (user.role !== "Reader") {
        alert("Access denied!");
        window.location.href = "../auth/login.html";
       
    }
</script>
